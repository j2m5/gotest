name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: gotest_test
          POSTGRES_PASSWORD: gotest_test
          POSTGRES_DB: gotest_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U gotest_test -d gotest_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      REQUIRE_DATABASE_TESTS: '1'
      REQUIRE_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Locate browser
        run: |
          browser_path=$(command -v google-chrome)
          echo "CHARACTER_BROWSER_BINARY=$browser_path" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm run setup
      - name: Audit dependencies
        run: npm run audit
      - name: Check API contract, application and integration tests
        env:
          TEST_DATABASE_URL: postgres://gotest_test:gotest_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/gotest_test?sslmode=disable
        run: npm run check
