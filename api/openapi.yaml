openapi: 3.0.3
info:
  title: Gotest API
  version: 1.0.0
  description: |
    Public HTTP contract for accounts, characters, chat and moderation. JSON request bodies must be
    objects, contain no unknown fields and fit within 16 KiB. Field validation and
    normalization are performed by the application; invalid input can produce 422.
    Password lengths are measured in UTF-8 bytes, not Unicode characters.

    All responses have Cache-Control: no-store and a server-generated X-Request-ID.
    Errors contain a stable code and a human-readable error message. Optional fields
    maps field names to messages; errors is the flattened list for compatibility.
    Unknown /api paths return 404 route_not_found; unsupported methods return 405
    method_not_allowed with Allow. These also use the ErrorResponse schema.

    Mutations require same-origin browser requests (or the configured trusted
    PUBLIC_URL origin). Cross-site requests are rejected with 403 origin_forbidden.
    The six public authentication actions share a per-client-IP rate limiter.
    JSON responses never expose passwords, token hashes or session tokens.
    Account roles are public codes; authorization always checks current server-side rights.
    Authentication email is accepted into a durable database queue. Workers retry
    failed delivery asynchronously; a queued message can still fail or be delivered
    more than once, so queue acceptance does not guarantee inbox delivery.
servers:
  - url: /
tags:
  - name: Auth
  - name: Characters
  - name: Health
paths:
  /api/auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Create an account and queue an email verification link
      description: Account creation and queueing the verification email are atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and verification email accepted into the durable queue
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in to a verified account
      description: |
        remember_me=true issues a persistent cookie with a fixed expiry. Otherwise
        the cookie lasts for the browser session. Both have a server-side expiry;
        neither is extended by activity. Login does not select a character.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Account and session cookie
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/logout:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the presented session and clear its cookie
      description: |
        Idempotent, including with no cookie. A valid session also clears the
        account's shared active character. Other sessions are not revoked.
      security:
        - {}
        - sessionCookie: []
      responses:
        '200': { $ref: '#/components/responses/SessionCleared' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/me:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      operationId: currentUser
      tags: [Auth]
      summary: Get the signed-in account
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current account; character_id may be null
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/verify:
    post:
      operationId: verifyEmail
      tags: [Auth]
      summary: Confirm an email address
      description: |
        Send a JSON token. For compatibility a token query parameter is accepted
        only when the request has no body. When a body is present its token wins.
        At least one of these forms is required; OpenAPI 3.0 cannot express this
        dependency between a query parameter and requestBody.
      parameters:
        - name: token
          in: query
          deprecated: true
          description: Legacy alternative to the JSON body
          schema: { $ref: '#/components/schemas/Token' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [Auth]
      summary: Resend an email verification link
      description: |
        Credentials are required. The optional remember_me field is accepted for
        compatibility and ignored. A successful response means the verification
        email was queued, not delivered; workers retry failures asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Request a password reset link
      description: |
        A valid email request is persisted before looking up the account. The
        response is identical for known and unknown emails. A successful response
        means any applicable email was accepted into the durable queue, not
        delivered; workers retry failures asynchronously. Each account has a
        one-minute mail cooldown.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Replace a password using a single-use reset link
      description: |
        Revokes all sessions of the target account, clears its active character
        and consumes all its reset links atomically. Email verification is unchanged.
        The password change and notification queueing are atomic. Clears the
        browser's session cookie on success. Notification delivery is asynchronous;
        a queued message can still fail or be delivered more than once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionCleared' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/characters:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      operationId: listCharacters
      tags: [Characters]
      summary: List characters owned by the signed-in account
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Owned characters and shared active selection; the list may be empty
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterRoster' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createCharacter
      tags: [Characters]
      summary: Create a character for the signed-in account
      description: The class must belong to the selected faction. Creating a character does not select it.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCharacterRequest' }
      responses:
        '201':
          description: Created character
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/characters/catalog:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      operationId: characterCatalog
      tags: [Characters]
      summary: Get available factions and their classes
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Character creation catalog
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CharacterCatalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/characters/active:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    put:
      operationId: setActiveCharacter
      tags: [Characters]
      summary: Select an owned character or clear the selection
      description: |
        Selection is shared by all sessions of this account. character_id must be
        present; an explicit null clears it. A missing field is a 400 invalid_request.
        A character not owned by this account is reported as not found.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetActiveCharacterRequest' }
      responses:
        '200':
          description: Selected character, or null after clearing selection
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Request-ID: { $ref: '#/components/headers/RequestID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveCharacterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /healthz:
    get:
      operationId: health
      tags: [Health]
      summary: Check process liveness
      responses:
        '200': { $ref: '#/components/responses/Healthy' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
    head:
      operationId: healthHead
      tags: [Health]
      summary: Check process liveness without a response body
      responses:
        '200': { $ref: '#/components/responses/Head' }
        '500': { $ref: '#/components/responses/Head' }
  /readyz:
    get:
      operationId: readiness
      tags: [Health]
      summary: Check database readiness and application lifecycle
      responses:
        '200': { $ref: '#/components/responses/Healthy' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    head:
      operationId: readinessHead
      tags: [Health]
      summary: Check readiness without a response body
      responses:
        '200': { $ref: '#/components/responses/Head' }
        '500': { $ref: '#/components/responses/Head' }
        '503': { $ref: '#/components/responses/Head' }
  /api/chat/messages:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      operationId: chatMessages
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/BeforeID'
      responses:
        '200':
          description: Successful operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: sendChatMessage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatRequest'
      responses:
        '201':
          description: Successful operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/chat/delete:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      operationId: deleteChatMessage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteChatRequest'
      responses:
        '200':
          description: Successful operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/moderation/bans:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      operationId: listBans
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/BeforeID'
        - $ref: '#/components/parameters/SocialUserID'
      responses:
        '200':
          description: Successful operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createBan
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BanRequest'
      responses:
        '201':
          description: Successful operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/moderation/revoke:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    post:
      operationId: revokeBan
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeBanRequest'
      responses:
        '200':
          description: Successful operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/moderation/actions:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      operationId: moderationActions
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/BeforeID'
      responses:
        '200':
          description: Successful operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/chat/events:
    get:
      operationId: chatEvents
      description: >-
        WebSocket upgrade requiring an allowed Origin, account_id precondition and session cookie. Text frames
        contain {"type":"changed"}; fetch current HTTP snapshots on connect and each event. Notification-only
        single-process hub; clients reconnect after disruption.
      security:
        - sessionCookie: []
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '101':
          description: WebSocket connection accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          description: WebSocket Upgrade headers required
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/chat/moderators:
    parameters:
      - $ref: '#/components/parameters/ExpectedAccount'
    get:
      operationId: chatModerators
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Successful operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratorList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: >-
        Public staff directory for authenticated players: one entry per verified, non-account-banned moderator
        or administrator. No email addresses or private moderation records.
components:
  parameters:
    BeforeID:
      name: before_id
      in: query
      required: false
      description: Exclusive cursor; newest first, at most 50 items.
      schema:
        type: integer
        format: int64
        minimum: 1
    SocialUserID:
      name: user_id
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
    ExpectedAccount:
      name: X-Account-ID
      in: header
      required: false
      description: |
        Optional precondition matching the account last displayed by the client.
        Authentication still uses the session cookie. A different authenticated
        account returns 409/account_changed before performing the operation or
        clearing a cookie. Missing/expired sessions retain normal 401 or idempotent
        logout behavior. The first-party UI supplies this header on account-scoped
        requests and reads /me without it to discover the current account.
      schema: { type: integer, format: int32, minimum: 1, maximum: 2147483647 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
      description: |
        Opaque session cookie set by login. HttpOnly, SameSite=Lax, Path=/; Secure
        when PUBLIC_URL uses HTTPS. JavaScript never reads or persists the token.
  headers:
    NoStore:
      required: true
      schema: { type: string, enum: [no-store] }
    RequestID:
      description: Server-generated identifier for correlating server logs
      required: true
      schema: { type: string, minLength: 1 }
    SessionCookie:
      description: |
        session_token; Path=/; HttpOnly; SameSite=Lax. Secure on HTTPS. Login with
        remember_me=true adds Expires and Max-Age; ordinary login omits both.
        Logout and reset-password expire this cookie with Max-Age=0.
      required: true
      schema: { type: string, pattern: '^session_token=' }
  schemas:
    Token:
      type: string
      pattern: '^[0-9a-fA-F]{64}$'
      description: Single-use opaque token from an email link
    NewPassword:
      type: string
      description: Between 8 and 72 UTF-8 bytes, inclusive; not a character-count limit
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, login, password]
      properties:
        email:
          type: string
          description: Email address; trimmed and lowercased, then validated (maximum 254 UTF-8 bytes)
        login:
          type: string
          description: Trimmed; 1 to 32 Unicode characters, without control characters
        password: { $ref: '#/components/schemas/NewPassword' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        remember_me:
          type: boolean
          nullable: true
          description: Omitted or null is equivalent to false
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: '#/components/schemas/Token' }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: Trimmed and lowercased, then validated as an email address (maximum 254 UTF-8 bytes)
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { $ref: '#/components/schemas/Token' }
        password: { $ref: '#/components/schemas/NewPassword' }
    User:
      type: object
      additionalProperties: false
      required: [id, email, login, role, character_id]
      properties:
        id: { type: integer, format: int32 }
        email: { type: string }
        login: { type: string }
        role: { $ref: '#/components/schemas/AccountRole' }
        character_id: { type: integer, format: int32, nullable: true }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    MessageResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }
    RegisterResponse:
      type: object
      additionalProperties: false
      required: [message, verification_queued]
      properties:
        message: { type: string }
        verification_queued:
          type: boolean
          description: True when the verification email was accepted into the durable queue; this does not guarantee inbox delivery.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - invalid_json
            - invalid_request
            - unsupported_media_type
            - request_too_large
            - method_not_allowed
            - route_not_found
            - origin_forbidden
            - rate_limited
            - internal_error
            - unauthenticated
            - validation_failed
            - invalid_credentials
            - email_unverified
            - account_conflict
            - account_changed
            - email_already_verified
            - verification_token_invalid
            - password_reset_unavailable
            - password_reset_token_invalid
            - character_not_found
            - character_name_taken
            - character_class_mismatch
            - not_ready
            - account_banned
            - forbidden
            - social_not_found
            - chat_banned
            - character_required
            - character_changed
            - ban_active
        fields:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        errors:
          type: array
          items: { type: string }
    Character:
      type: object
      additionalProperties: false
      required: [id, name, faction_id, class_id, role, level, experience, avatar, hp, mp, hp_current, mp_current]
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
        faction_id: { type: integer, format: int32 }
        class_id: { type: integer, format: int32 }
        role: { type: string }
        level: { type: integer }
        experience: { type: integer }
        avatar: { type: string, nullable: true }
        hp: { type: integer }
        mp: { type: integer }
        hp_current: { type: integer }
        mp_current: { type: integer }
    CatalogEntry:
      type: object
      additionalProperties: false
      required: [id, code, name, description, icon]
      properties:
        id: { type: integer, format: int32 }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
    CharacterClass:
      type: object
      additionalProperties: false
      required: [id, faction_id, code, name, description, icon]
      properties:
        id: { type: integer, format: int32 }
        faction_id: { type: integer, format: int32 }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
    CharacterCatalog:
      type: object
      additionalProperties: false
      required: [factions, classes]
      properties:
        factions:
          type: array
          items: { $ref: '#/components/schemas/CatalogEntry' }
        classes:
          type: array
          items: { $ref: '#/components/schemas/CharacterClass' }
    CharacterRoster:
      type: object
      additionalProperties: false
      required: [characters, active_character_id]
      properties:
        characters:
          type: array
          items: { $ref: '#/components/schemas/Character' }
        active_character_id: { type: integer, format: int32, nullable: true }
    CreateCharacterRequest:
      type: object
      additionalProperties: false
      required: [name, faction_id, class_id]
      properties:
        name:
          type: string
          description: |
            NFC-normalized, trimmed, repeated spaces collapsed. Result must have
            3 to 32 Unicode characters, start/end with a Latin or Cyrillic letter,
            and contain only those letters, spaces, hyphens or apostrophes.
        faction_id: { type: integer, format: int32, minimum: 1 }
        class_id: { type: integer, format: int32, minimum: 1 }
    SetActiveCharacterRequest:
      type: object
      additionalProperties: false
      required: [character_id]
      properties:
        character_id: { type: integer, format: int32, minimum: 1, nullable: true }
    CharacterResponse:
      type: object
      additionalProperties: false
      required: [character]
      properties:
        character: { $ref: '#/components/schemas/Character' }
    ActiveCharacterResponse:
      type: object
      additionalProperties: false
      required: [character]
      properties:
        character:
          anyOf:
            - $ref: '#/components/schemas/Character'
            - type: object
              nullable: true
              enum: [null]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    AccountRole:
      type: string
      enum:
        - user
        - moderator
        - administrator
    ChatMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - character_id
        - author_name
        - author_role
        - body
        - created_at
        - deleted_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          type: integer
          format: int32
          minimum: 1
        character_id:
          type: integer
          format: int32
          minimum: 1
        author_name:
          type: string
        author_role:
          $ref: '#/components/schemas/AccountRole'
        body:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
    UserBan:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - scope
        - reason
        - created_by_user_id
        - created_at
        - expires_at
        - revoked_at
        - revoked_by_user_id
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          type: integer
          format: int32
          minimum: 1
        scope:
          type: string
          enum:
            - chat
            - forum
            - account
        reason:
          type: string
        created_by_user_id:
          type: integer
          format: int32
          minimum: 1
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoked_by_user_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
    ModerationAction:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_user_id
        - user_id
        - scope
        - action
        - reason
        - ban_id
        - message_id
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        actor_user_id:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        user_id:
          type: integer
          format: int32
          minimum: 1
        scope:
          type: string
          enum:
            - chat
            - forum
            - account
        action:
          type: string
          enum:
            - ban
            - revoke
            - delete_message
            - role_change
        reason:
          type: string
        ban_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        message_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        created_at:
          type: string
          format: date-time
    ChatPage:
      type: object
      additionalProperties: false
      required:
        - messages
        - next_before_id
        - chat_ban
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        next_before_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        chat_ban:
          anyOf:
            - $ref: '#/components/schemas/UserBan'
            - type: object
              nullable: true
              enum:
                - null
    BanPage:
      type: object
      additionalProperties: false
      required:
        - bans
        - next_before_id
      properties:
        bans:
          type: array
          items:
            $ref: '#/components/schemas/UserBan'
        next_before_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
    ActionPage:
      type: object
      additionalProperties: false
      required:
        - actions
        - next_before_id
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ModerationAction'
        next_before_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
    SendChatRequest:
      type: object
      additionalProperties: false
      required:
        - body
        - character_id
      properties:
        body:
          type: string
          description: >-
            Plain text; 1 to 1000 Unicode characters after trim. At most one message every two seconds per
            account.
        character_id:
          type: integer
          format: int32
          minimum: 1
          description: Expected active character; a change returns 409 without sending.
    DeleteChatRequest:
      type: object
      additionalProperties: false
      required:
        - message_id
        - reason
      properties:
        message_id:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          description: Trimmed reason; 3 to 500 Unicode characters.
    BanRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
        - scope
        - duration_hours
        - reason
      properties:
        user_id:
          type: integer
          format: int32
          minimum: 1
        scope:
          type: string
          enum:
            - chat
            - forum
            - account
        duration_hours:
          type: integer
          minimum: 1
          maximum: 168
          nullable: true
          description: Explicit null means permanent; permitted only for account bans by administrators.
        reason:
          type: string
          description: Trimmed reason; 3 to 500 Unicode characters.
    RevokeBanRequest:
      type: object
      additionalProperties: false
      required:
        - ban_id
        - reason
      properties:
        ban_id:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          description: Trimmed reason; 3 to 500 Unicode characters.
    ChatMessageResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          $ref: '#/components/schemas/ChatMessage'
    BanResponse:
      type: object
      additionalProperties: false
      required:
        - ban
      properties:
        ban:
          $ref: '#/components/schemas/UserBan'
    Moderator:
      type: object
      additionalProperties: false
      required:
        - user_id
        - login
        - role
        - character_name
      properties:
        user_id:
          type: integer
          format: int32
          minimum: 1
        login:
          type: string
        role:
          type: string
          enum:
            - moderator
            - administrator
        character_name:
          type: string
          nullable: true
    ModeratorList:
      type: object
      additionalProperties: false
      required:
        - moderators
      properties:
        moderators:
          type: array
          items:
            $ref: '#/components/schemas/Moderator'
  responses:
    Message:
      description: Operation completed
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessageResponse' }
    SessionCleared:
      description: Operation completed and session cookie expired
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
        Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MessageResponse' }
    Healthy:
      description: Healthy
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HealthResponse' }
    Head:
      description: Status and headers only; no response body
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
    BadRequest:
      description: invalid_json, invalid_request, verification_token_invalid or password_reset_token_invalid
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: unauthenticated or invalid_credentials
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: origin_forbidden or email_unverified
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: character_not_found; for unknown /api paths, route_not_found
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MethodNotAllowed:
      description: method_not_allowed
      headers:
        Allow:
          required: true
          schema: { type: string, minLength: 1 }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: account_conflict, account_changed, email_already_verified or character_name_taken
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RequestTooLarge:
      description: request_too_large; JSON body exceeds 16 KiB
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnsupportedMediaType:
      description: unsupported_media_type; a JSON body requires application/json
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: validation_failed or character_class_mismatch; fields contains validation messages
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: rate_limited; retry after the number of seconds in Retry-After
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: internal_error; internal diagnostic details are not returned to clients
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: password_reset_unavailable or not_ready
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        X-Request-ID: { $ref: '#/components/headers/RequestID' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
