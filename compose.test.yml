name: gotest-tests
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: gotest_test
      POSTGRES_PASSWORD: gotest_test
      POSTGRES_DB: gotest_test
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotest_test -d gotest_test"]
      interval: 2s
      timeout: 5s
      retries: 30
