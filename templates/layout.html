<!DOCTYPE html>
<html lang="ru">
<head>
    <title>{{ .Title }}</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <a href="/">Logo</a>
        </header>
        <main>
            {{ if .Errors }}
                <div class="flash-errors">
                    {{ range .Errors }}
                    <div class="flash-error">{{ . }}</div>
                    {{ end }}
                </div>
            {{ end }}

            {{ template "content" . }}
        </main>
    </div>
</body>
</html>
