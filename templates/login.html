{{ define "content" }}

<h1>Вход</h1>

<form method="POST" action="/login">
    <div class="text-center form-item">
        <label class="block text-light-orange" for="email">Электронная почта</label>
        <input id="email" type="email" name="email" placeholder="Электронная почта">
    </div>
    <div class="text-center form-item">
        <label class="block text-light-orange" for="password">Пароль</label>
        <input id="password" type="password" name="password" placeholder="Пароль">
    </div>
    <button type="submit" class="btn-primary">
        Войти
    </button>
</form>

{{ end }}
