{{ define "content" }}

<h1>Login</h1>

<form method="POST" action="/login">

    <div>
        <input
                type="text"
                name="username"
                placeholder="Username"
        >
    </div>

    <div>
        <input
                type="password"
                name="password"
                placeholder="Password"
        >
    </div>

    <button type="submit">
        Login
    </button>

</form>

{{ end }}
