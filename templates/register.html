{{ define "content" }}

<h1>Register</h1>

<form method="POST" action="/register">

    <div>
        <input
                type="text"
                name="username"
                placeholder="Username"
        >
    </div>

    <div>
        <input
                type="password"
                name="password"
                placeholder="Password"
        >
    </div>

    <button type="submit">
        Register
    </button>

</form>

{{ end }}
